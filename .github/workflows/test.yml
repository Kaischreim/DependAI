name: Run Tests
on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Go tests
        run: go test ./...

      - name: Install JS dependencies folder1
        run: cd folder1 && npm install

      - name: Install JS dependencies folder2
        run: cd folder2 && npm install
