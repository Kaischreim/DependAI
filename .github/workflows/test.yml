name: Run Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Go tests
        run: go test ./...

      - name: Test folder1
        working-directory: folder1
        run: |
          npm install
          npm test

      - name: Test folder2
        working-directory: folder2
        run: |
          npm install
          npm test
